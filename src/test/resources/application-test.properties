# Perfil de test para pruebas de integracion de migraciones (Fase 2).
# Flyway es el unico responsable de gestionar el esquema: se deshabilita el
# auto-DDL de Hibernate para que las tablas provengan exclusivamente de las
# migraciones V1/V2 aplicadas contra el Testcontainer de PostgreSQL.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
